departments:
  Operations: Safe production, unit surveillance, control-room operations, startup
    and shutdown.
  Maintenance: Mechanical, electrical and instrumentation maintenance, work orders
    and reliability.
  Inspection & Integrity: Inspection planning, corrosion monitoring, mechanical integrity
    and technical recommendations.
  Process Engineering: Process calculations, operating envelopes, technical studies
    and optimization.
  Electrical: Power distribution, motors, protection, testing and electrical reliability.
  Instrumentation: Transmitters, analyzers, control loops, calibration and instrumentation
    reliability.
  HSE: Permit to work, process safety, emergency response, incident management and
    environmental controls.
  Projects: Capital projects, modifications, construction and commissioning.
  Procurement: Sourcing, vendor qualification, purchase orders and commercial governance.
  Finance: Budgeting, cost control, accounting and management reporting.
  HR: Recruitment, competency, training and employee services.
  IT: Identity, infrastructure, cybersecurity and sovereign AI platform operations.
