version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sovereign-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovereign-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=sqlite:///./data/runtime/workbench.db
      - COMPANY_DATA_PATH=/app/data/ApexPetro_Sovereign_Dataset_v3
      - OFFLINE_MODE=true
    volumes:
      - ./data:/app/data
      - ../ApexPetro_Sovereign_Dataset_v3:/app/data/ApexPetro_Sovereign_Dataset_v3:ro
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data: